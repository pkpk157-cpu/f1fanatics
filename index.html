<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>F1 Fanatics — League Tracker</title>
<meta name="description" content="Standings and stats for the F1 Fanatics F1 Fantasy league: race-by-race scores, rank movement, form, team value and ownership." />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#050506" />
<script>
  /* the saved theme, before first paint: dark (default), light or system */
  (function () {
    var t = "dark";
    try { var v = JSON.parse(localStorage.getItem("f1f.theme")); if (v === "light" || v === "system") t = v; } catch (e) {}
    document.documentElement.setAttribute("data-theme", t);
    window.F1F_T0 = Date.now();
  })();
</script>
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="F1 Fanatics" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="favicon-64.png" type="image/png" sizes="64x64" />
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- opening screen: at least two seconds, longer if the data is still on its way -->
  <div id="splash" aria-hidden="true">
    <img src="logo.webp" alt="" width="200" height="200" fetchpriority="high" />
    <p>The home of the F1 Fanatics</p>
  </div>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img src="icon-192.png" alt="" width="36" height="36" />
        <div style="min-width:0">
          <div class="brand-name" id="leagueName">F1 Fanatics</div>
          <div class="brand-sub" id="subline">Loading…</div>
        </div>
      </div>
      <button class="iconbtn" id="menuBtn" aria-label="Menu" title="Menu" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>
    </div>
  </header>

  <nav class="subtabs" id="subtabs" aria-label="Sub-sections"></nav>
  <div id="banner" class="banner" hidden></div>
  <main id="view" aria-live="polite"><div class="loading">Loading the league…</div></main>


  <nav class="tabbar" id="tabs" aria-label="Sections">
    <a href="#league" data-tab="league"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3" /></svg>League</a>
    <a href="#races" data-tab="races"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 4h13l-2 4 2 4H5" /></svg>Races</a>
    <a href="#gp" data-tab="gp" class="gp-tab"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5" /><path d="M12 13.5V9.5M10 2.5h4M18.5 6.5l1.5-1.5" /></svg><span class="gp-l">GP</span></a>
    <a href="#trends" data-tab="trends"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-6 4 3 8-9M15 5h5v5" /></svg>Trends</a>
    <a href="#you" data-tab="you" class="you-tab"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" /></svg>Your profile</a>
  </nav>

  <dialog id="drawer" class="drawer" aria-label="Menu">
    <div class="drawer-inner" id="drawerBody"></div>
  </dialog>

  <dialog id="sheet" class="sheet">
    <div class="sheet-inner">
      <button class="iconbtn sheet-close" id="sheetClose" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
      <div id="sheetBody"></div>
    </div>
  </dialog>

  <script src="config.js"></script>
  <script src="compute.js"></script>
  <script src="rules.js"></script>
  <script src="motion.js"></script>
  <script src="app.js"></script>
</body>
</html>
