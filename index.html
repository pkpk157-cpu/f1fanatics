<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>F1 Fanatics — League Tracker</title>
<meta name="description" content="Standings and stats for the F1 Fanatics F1 Fantasy league: race-by-race scores, rank movement, form, team value and ownership." />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#050506" />
<script>
  /* the saved theme, before first paint: dark (default), light or system */
  (function () {
    var t = "dark";
    try { var v = JSON.parse(localStorage.getItem("f1f.theme")); if (v === "light" || v === "system") t = v; } catch (e) {}
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="F1 Fanatics" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="favicon-64.png" type="image/png" sizes="64x64" />
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img src="icon-192.png" alt="" width="36" height="36" />
        <div style="min-width:0">
          <div class="brand-name" id="leagueName">F1 Fanatics</div>
          <div class="brand-sub" id="subline">Loading…</div>
        </div>
      </div>
      <button class="iconbtn" id="settingsBtn" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" /><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.14.6.66 1 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z" /></svg>
      </button>
    </div>
  </header>

  <h1 class="pagetitle" id="pageTitle"></h1>
  <div id="banner" class="banner" hidden></div>
  <main id="view" aria-live="polite"><div class="loading">Loading the league…</div></main>


  <nav class="tabbar" id="tabs" aria-label="Sections">
    <a href="#standings" data-tab="standings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3" /></svg>Standings</a>
    <a href="#races" data-tab="races"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 4h13l-2 4 2 4H5" /></svg>Races</a>
    <a href="#trends" data-tab="trends"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-6 4 3 8-9M15 5h5v5" /></svg>Trends</a>
    <a href="#stats" data-tab="stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9M3 20h18" /></svg>Stats</a>
    <a href="#picks" data-tab="picks"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 3v9l6.4 6.4" /></svg>Picks</a>
  </nav>

  <dialog id="sheet" class="sheet">
    <div class="sheet-inner">
      <button class="iconbtn sheet-close" id="sheetClose" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
      <div id="sheetBody"></div>
    </div>
  </dialog>

  <script src="config.js"></script>
  <script src="compute.js"></script>
  <script src="rules.js"></script>
  <script src="app.js"></script>
</body>
</html>
