# Fetches the league from F1 Fantasy's public feeds, checks it, and publishes
# data.json to GitHub Pages — in one job, because a commit made with the
# built-in GITHUB_TOKEN does not trigger the separate Pages workflow.
#
# Started every ten minutes by heartbeat.yml (the clock). The schedule below
# is only a backstop: GitHub delays and drops scheduled runs badly.
#
# data.json is committed only when F1's numbers changed, so between races
# most runs fetch, find nothing new, and stop without a commit or a deploy.
name: Update F1 data
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  # Shared with the Pages deploy. Never cancel: a deploy queued mid-fetch
  # waits ~20s rather than killing a fresh update.
  group: pages
  cancel-in-progress: false
jobs:
  update:
    # Pinned for the season, so the runner image doesn't change mid-season.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # F1 down or busy is not a failure: the script keeps the data already
      # live, says why, and sets "skip", so nothing below runs and the run
      # stays green. A fault in the script itself still fails the run.
      - name: Fetch F1 data
        id: fetch
        run: node scripts/fetch-data.js
      - name: F1 unavailable, the last data stays live
        if: steps.fetch.outputs.skip == 'true'
        env:
          REASON: ${{ steps.fetch.outputs.reason }}
        run: echo "$REASON"
      - name: Verify against F1's own numbers
        if: steps.fetch.outputs.changed == 'true'
        # Never blocks publishing — fresh data beats stale data — but any
        # disagreement between the standings and the rounds shows up as a
        # warning on the run.
        run: node scripts/verify-data.js
      - name: Commit data.json
        id: commit
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Two runs can overlap (backstop + heartbeat). Each attempt starts
          # again from what is live and only publishes if this fetch is newer.
          cp data.json /tmp/fresh.json
          MSG="Update F1 data ($(date -u +%Y-%m-%dT%H:%MZ))"
          stamp() { node -p 'try { JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).generatedAt || "" } catch (e) { "" }' "$1"; }
          MINE=$(stamp /tmp/fresh.json)
          for i in 1 2 3 4 5; do
            git fetch -q --depth=1 origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            LIVE=$(stamp data.json)
            if [ -n "$LIVE" ] && [ "$MINE" \< "$LIVE" ]; then
              echo "a fresher data.json ($LIVE) is already live; nothing to publish"
              exit 0
            fi
            cp /tmp/fresh.json data.json
            git add data.json
            if git diff --cached --quiet; then echo "identical data already live"; exit 0; fi
            git commit -q -m "$MSG"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected, starting again (attempt $i)"
            sleep $((i * 3))
          done
          echo "could not push data.json after 5 attempts" >&2
          exit 1
      # The tests are not part of the app; trim them from this runner's
      # checkout (never the repository) before it is packed for Pages.
      - if: steps.commit.outputs.pushed == 'true'
        run: rm -rf tests .github
      - if: steps.commit.outputs.pushed == 'true'
        uses: actions/configure-pages@v5
      - if: steps.commit.outputs.pushed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      # Pages now and then refuses a deploy made while it still considers the
      # previous one in progress. Ask once more after a pause.
      - id: deployment
        if: steps.commit.outputs.pushed == 'true'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: echo "deploy refused, asking again in 60s"; sleep 60
      - id: deploy2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
