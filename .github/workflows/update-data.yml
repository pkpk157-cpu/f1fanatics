# Fetches the league from F1 Fantasy's public feeds, checks it, commits
# data.json when F1's numbers changed, and deploys it to GitHub Pages (a
# commit made with the built-in GITHUB_TOKEN does not trigger pages.yml).
#
# Started every ten minutes by heartbeat.yml (the clock). The schedule below
# is only a backstop: GitHub delays and drops scheduled runs badly. After the
# season the backstop does nothing (scripts/season-over.js).
#
# Two jobs, so only a real deploy queues on the Pages lock: the fetch has
# its own lock and can never push a deploy of your code out of the queue.
name: Update F1 data
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  update:
    # Pinned for the season, so the runner image doesn't change mid-season.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: update-data
      cancel-in-progress: false
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Is the season still on?
        id: season
        if: github.event_name == 'schedule'
        run: echo "over=$(node scripts/season-over.js)" >> "$GITHUB_OUTPUT"
      # F1 down or busy is not a failure: the script keeps the data already
      # live, says why, and sets "skip", so nothing below runs and the run
      # stays green. A fault in the script itself still fails the run.
      - name: Fetch F1 data
        id: fetch
        if: steps.season.outputs.over != 'true'
        run: node scripts/fetch-data.js
      - name: F1 unavailable, the last data stays live
        if: steps.fetch.outputs.skip == 'true'
        env:
          REASON: ${{ steps.fetch.outputs.reason }}
        run: echo "$REASON"
      - name: Verify against F1's own numbers
        if: steps.fetch.outputs.changed == 'true'
        # Never blocks publishing — fresh data beats stale data — but any
        # disagreement between the standings and the rounds shows up as a
        # warning on the run.
        run: node scripts/verify-data.js
      - name: Commit data.json
        id: commit
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Each attempt starts again from what is live and only publishes
          # if this fetch is newer.
          cp data.json /tmp/fresh.json
          MSG="Update F1 data ($(date -u +%Y-%m-%dT%H:%MZ))"
          stamp() { node -p 'try { JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).generatedAt || "" } catch (e) { "" }' "$1"; }
          MINE=$(stamp /tmp/fresh.json)
          for i in 1 2 3 4 5; do
            git fetch -q --depth=1 origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            LIVE=$(stamp data.json)
            if [ -n "$LIVE" ] && [ "$MINE" \< "$LIVE" ]; then
              echo "a fresher data.json ($LIVE) is already live; nothing to publish"
              exit 0
            fi
            cp /tmp/fresh.json data.json
            git add data.json
            if git diff --cached --quiet; then echo "identical data already live"; exit 0; fi
            git commit -q -m "$MSG"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected, starting again (attempt $i)"
            sleep $((i * 3))
          done
          echo "could not push data.json after 5 attempts" >&2
          exit 1

  deploy:
    needs: update
    if: needs.update.outputs.pushed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
